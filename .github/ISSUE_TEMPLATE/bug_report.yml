name: Bug report
description: Something is broken or incorrect in nyxd / nyx.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please include enough detail to reproduce the issue on Linux with `crun` where relevant.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences — what went wrong?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Commands, flags, and minimal config (compose snippet, `nyx run` line, etc.).
      placeholder: |
        1. `sudo ./bin/nyxd ...`
        2. `sudo ./bin/nyx run ...`
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Paste logs, HTTP errors, or stack traces (redact secrets).
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Output of `nyx version`, git SHA, or release tag.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS + kernel, `crun --version`, `-net-driver` (native/cni), root vs rootless.
    validations:
      required: false
