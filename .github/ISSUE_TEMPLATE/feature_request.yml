name: Feature request
description: Suggest an improvement or new capability.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem you are solving, not only the solution you have in mind. Feature work must stay compatible with the project license (`LICENSE`).

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What is hard, missing, or inconsistent today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: How should nyxd / nyx behave? APIs, CLI flags, docs, etc.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools, workarounds, or designs you evaluated.
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: Scope (optional)
      options:
        - label: Daemon (`nyxd`)
        - label: CLI (`nyx`)
        - label: Networking (native / CNI)
        - label: Image pull / storage
        - label: Documentation only
