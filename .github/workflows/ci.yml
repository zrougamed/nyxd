name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Namespaced unit tests and the e2e scripts run real containers
      # unprivileged: crun, newuidmap/newgidmap with a subordinate range, nft,
      # and unprivileged user namespaces (restricted by AppArmor on 24.04).
      - name: Prerequisites
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          which crun newuidmap newgidmap nft bzip2 || { sudo apt-get update && sudo apt-get install -y crun uidmap nftables bzip2; }
          grep -q "^$(id -un):" /etc/subuid || sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 "$(id -un)"

      - name: Vet
        run: make vet

      # Unit tests plus the rootless, build, transfer and WSL end-to-end
      # scripts against -cover builds; fails below COVER_MIN (statements,
      # whole module, merged).
      - name: Tests and coverage
        env:
          E2E: "1"
          COVER_MIN: "91.5"
        run: scripts/coverage.sh

      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            coverage/coverage.out
            coverage/packages.txt
            coverage/total.txt

      - name: Build binaries
        run: make build build-nyx

      - name: Build Windows client and WSL distro tarballs
        run: |
          make build-windows
          make wsl-rootfs WSL_ARCH=amd64
          make wsl-rootfs WSL_ARCH=arm64
          mkdir -p wsl-rootfs
          tar -xzf bin/nyx-wsl-amd64.tar.gz -C wsl-rootfs

      - name: Build macOS VM image (amd64)
        run: make vm-image VM_ARCH=amd64

      # The distro ships to Windows users as-is: fail on known vulnerabilities in
      # what it contains (nyxd's Go modules; crun is pinned in build-wsl-rootfs.sh).
      - name: Grype scan (WSL distro)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          path: wsl-rootfs
          fail-build: true
          severity-cutoff: medium
          output-format: table

      - name: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          # Reuse the toolchain from setup-go above: no second Go install or
          # cache restore (avoids "Cannot open: File exists" noise).
          go-version-input: ""
          go-version-file: go.mod
          cache: false
          check-latest: false
          repo-checkout: false
          go-package: ./...

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Grype scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        continue-on-error: true
        with:
          path: .
          fail-build: false
          output-format: table

  # The one-line install from the package repositories, in a fresh container
  # per distribution (Ubuntu, Debian, Fedora, Rocky, openSUSE, Alpine, Arch):
  # each must finish within 60 seconds. Throwaway signing keys, local server.
  repos:
    runs-on: ${{ (github.event.pull_request.head.repo.fork && 'ubuntu-latest') || fromJSON(vars.GH_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser needs the tags for the snapshot version

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install from the repositories
        run: scripts/repo-smoke.sh
