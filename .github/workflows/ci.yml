name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: make vet

      - name: Test
        run: make test

      - name: Overlay mount test (user namespace)
        run: |
          # Ubuntu 24.04 runners restrict unprivileged user namespaces via AppArmor.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          make test-overlay

      - name: Rootless end-to-end (crun + uidmap from the runner image)
        run: |
          which crun newuidmap newgidmap || { sudo apt-get update && sudo apt-get install -y crun uidmap; }
          grep -q "^$(id -un):" /etc/subuid || sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 "$(id -un)"
          make test-rootless

      - name: Image build end-to-end (rootless)
        run: make test-build

      - name: Build binaries
        run: make build build-nyx

      - name: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          # Reuse the toolchain from setup-go above: no second Go install or
          # cache restore (avoids "Cannot open: File exists" noise).
          go-version-input: ""
          go-version-file: go.mod
          cache: false
          check-latest: false
          repo-checkout: false
          go-package: ./...

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Grype scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        continue-on-error: true
        with:
          path: .
          fail-build: false
          output-format: table
