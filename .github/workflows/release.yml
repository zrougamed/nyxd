name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  publish:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release artifacts
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          COMMIT_SHORT="${GITHUB_SHA:0:7}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-w -s -X main.version=${VERSION} -X main.gitCommit=${COMMIT_SHORT} -X main.buildDate=${DATE}"
          mkdir -p dist
          for goarch in amd64 arm64; do
            out="dist/nyxd-linux-${goarch}"
            CGO_ENABLED=0 GOOS=linux GOARCH="${goarch}" \
              go build -trimpath -ldflags "${LDFLAGS}" \
              -o "${out}" ./cmd/nyxd
            sha256sum "${out}" > "${out}.sha256"
          done
          for goarch in amd64 arm64; do
            out="dist/nyx-linux-${goarch}"
            CGO_ENABLED=0 GOOS=linux GOARCH="${goarch}" \
              go build -trimpath -ldflags "${LDFLAGS}" \
              -o "${out}" ./cmd/nyx
            sha256sum "${out}" > "${out}.sha256"
          done
          for goarch in amd64 arm64; do
            out="dist/nyx-windows-${goarch}.exe"
            CGO_ENABLED=0 GOOS=windows GOARCH="${goarch}" \
              go build -trimpath -ldflags "${LDFLAGS}" \
              -o "${out}" ./cmd/nyx
            sha256sum "${out}" > "${out}.sha256"
          done
          # WSL2 distro tarballs; `nyx machine init` downloads
          # nyx-wsl-<arch>.tar.gz from the release matching its version and
          # checks it against the .sha256 next to it.
          for goarch in amd64 arm64; do
            scripts/build-wsl-rootfs.sh "${goarch}" dist "${VERSION}"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/nyxd-linux-amd64
            dist/nyxd-linux-amd64.sha256
            dist/nyxd-linux-arm64
            dist/nyxd-linux-arm64.sha256
            dist/nyx-linux-amd64
            dist/nyx-linux-amd64.sha256
            dist/nyx-linux-arm64
            dist/nyx-linux-arm64.sha256
            dist/nyx-windows-amd64.exe
            dist/nyx-windows-amd64.exe.sha256
            dist/nyx-windows-arm64.exe
            dist/nyx-windows-arm64.exe.sha256
            dist/nyx-wsl-amd64.tar.gz
            dist/nyx-wsl-amd64.tar.gz.sha256
            dist/nyx-wsl-arm64.tar.gz
            dist/nyx-wsl-arm64.tar.gz.sha256
