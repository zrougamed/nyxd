name: Repository smoke

# The one-line install from the package repositories, in a fresh container
# per distribution (Ubuntu, Debian, Fedora, Rocky, openSUSE, Alpine, Arch):
# each must finish within 60 seconds. Throwaway signing keys, local server
# (scripts/repo-smoke.sh). On main, on pull requests that touch packaging,
# by hand, and before every release (release.yml).

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .goreleaser.yaml
      - packaging/**
      - scripts/install.sh
      - scripts/repo-smoke.sh
      - scripts/build-repos.sh
      - scripts/pins.sh
      - .github/workflows/repo-smoke.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: repo-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repos:
    runs-on: ${{ (github.event.pull_request.head.repo.fork && 'ubuntu-latest') || fromJSON(vars.GH_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser needs the tags for the snapshot version
          filter: blob:none # full history without every old file's contents

      # No module cache: the runners are ephemeral, nyxd has few modules, and
      # saving the cache from a self-hosted runner took up to 24 minutes.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # The release binary, not `go run`: compiling GoReleaser from source
      # took minutes and hundreds of module downloads on every run.
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.2
          install-only: true

      # Without Docker (the self-hosted runners only have nyxd, and jobs get
      # no access to the host's daemon), start a throwaway rootless nyxd
      # built from this checkout, with everything under RUNNER_TEMP.
      - name: Throwaway nyxd
        run: |
          set -euo pipefail
          if docker info >/dev/null 2>&1; then
            echo "docker is available: repo-smoke.sh uses it"
            exit 0
          fi
          command -v crun newuidmap newgidmap >/dev/null ||
            { sudo apt-get update -qq && sudo apt-get install -y -qq crun uidmap; }
          grep -q "^$(id -un):" /etc/subuid ||
            sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 "$(id -un)"
          d="$RUNNER_TEMP/nyxd"
          mkdir -p "$d"
          go build -o "$d/nyxd" ./cmd/nyxd
          "$d/nyxd" -base-dir "$d/data" -socket "$d/nyxd.sock" -net-driver host >"$d/nyxd.log" 2>&1 &
          echo $! >"$d/pid"
          for _ in $(seq 1 100); do [ -S "$d/nyxd.sock" ] && break; sleep 0.2; done
          [ -S "$d/nyxd.sock" ] || { cat "$d/nyxd.log"; exit 1; }
          echo "NYXD_SOCKET=$d/nyxd.sock" >>"$GITHUB_ENV"

      - name: Install from the repositories
        env:
          GORELEASER: goreleaser
        run: scripts/repo-smoke.sh

      - name: Stop nyxd
        if: always()
        run: |
          d="$RUNNER_TEMP/nyxd"
          [ -f "$d/pid" ] || exit 0
          kill "$(cat "$d/pid")" 2>/dev/null || true
          for _ in $(seq 1 60); do kill -0 "$(cat "$d/pid")" 2>/dev/null || break; sleep 0.5; done
          if [ "${{ job.status }}" != success ]; then tail -50 "$d/nyxd.log"; fi
