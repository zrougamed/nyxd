name: Repository smoke

# The one-line install from the package repositories, in a fresh container
# per distribution (Ubuntu, Debian, Fedora, Rocky, openSUSE, Alpine, Arch):
# each must finish within 60 seconds. Throwaway signing keys, local server
# (scripts/repo-smoke.sh). On main, on pull requests that touch packaging,
# by hand, and before every release (release.yml).

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .goreleaser.yaml
      - packaging/**
      - scripts/install.sh
      - scripts/repo-smoke.sh
      - scripts/build-repos.sh
      - scripts/pins.sh
      - .github/workflows/repo-smoke.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: repo-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repos:
    runs-on: ${{ (github.event.pull_request.head.repo.fork && 'ubuntu-latest') || fromJSON(vars.GH_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser needs the tags for the snapshot version
          filter: blob:none # full history without every old file's contents

      # No module cache: the runners are ephemeral, nyxd has few modules, and
      # saving the cache from a self-hosted runner took up to 24 minutes.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # The release binary, not `go run`: compiling GoReleaser from source
      # took minutes and hundreds of module downloads on every run.
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.2
          install-only: true

      - name: Install from the repositories
        env:
          GORELEASER: goreleaser
        run: scripts/repo-smoke.sh
