# gitleaks configuration: the default rules, plus one recorded exception.
[extend]
useDefault = true

# The REST reference pages are generated by docusaurus-plugin-openapi-docs
# (bun run docusaurus gen-api-docs nyxd). Their "api:" front matter is the
# endpoint's OpenAPI description, zlib-compressed and base64-encoded: high
# entropy, so the generic-api-key rule matches it, but it holds no secret
# (checked by decoding all of them). Only that line, only in those files.
[[allowlists]]
description = "generated OpenAPI pages: api: front matter is the encoded endpoint description"
condition = "AND" # the path and the value must both match; anything else in these files is still scanned
paths = ['''^website/docs/reference/api/[^/]+\.api\.mdx$''']
# Tested against the reported secret: a zlib stream in base64 (always "eJ"),
# at least 100 characters long.
regexes = ['''^eJ[A-Za-z0-9+/=]{100,}$''']
