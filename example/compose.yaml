version: "1"

networks:
  nyx-net:
    driver: bridge
    subnet: "10.88.0.0/24"

services:
  rabbitmq:
    image: rabbitmq:3-management
    restart: always
    networks:
      - nyx-net
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "15672:15672"
      - "5672:5672"
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - /var/lib/nyxd/rabbitmq:/var/lib/rabbitmq
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "128m"
    no_new_privileges: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  subscriber:
    image: python:3.12-slim
    restart: on-failure
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - nyx-net
    environment:
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      QUEUE_NAME: "task_queue"
    volumes:
      - ./subscriber:/app
    working_dir: /app
    command: ["python", "subscriber.py"]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import pika' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "128m"
    no_new_privileges: true

  consumer:
    image: python:3.12-slim
    restart: on-failure
    depends_on:
      rabbitmq:
        condition: service_healthy
      subscriber:
        condition: service_started
    networks:
      - nyx-net
    environment:
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      QUEUE_NAME: "task_queue"
    volumes:
      - ./consumer:/app
    working_dir: /app
    command: ["python", "consumer.py"]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import pika' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "128m"
    no_new_privileges: true
