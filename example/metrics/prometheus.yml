# Scrape nyxd's metrics. Start nyxd with a TCP metrics listener, e.g. in
# /etc/default/nyxd: NYXD_OPTS="-metrics-listen 127.0.0.1:9323"
# It serves /metrics only (read-only, no other API). Keep it on loopback or
# a trusted network: container names and images are visible to whoever can
# reach it.
scrape_configs:
  - job_name: nyxd
    scrape_interval: 15s
    static_configs:
      - targets: ["127.0.0.1:9323"]
