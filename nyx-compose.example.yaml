# nyx-compose.yaml - Example workload definition for nyxd
# Syntax is compose-spec compatible subset.

version: "1"

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: always
    hostname: rabbitmq
    read_only: true
    deploy:
      resources:
        limits:
          memory: 128m
          pids: 128
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  producer:
    image: python:3.12-slim
    depends_on:
      - rabbitmq
    restart: on-failure
    hostname: producer
    command: >
      sh -c "pip install pika && python -u -c \"import pika, time; params=pika.URLParameters('amqp://guest:guest@rabbitmq:5672/'); connection=pika.BlockingConnection(params); channel=connection.channel(); channel.queue_declare(queue='task_queue', durable=True); [channel.basic_publish(exchange='', routing_key='task_queue', body=f'hello {i}', properties=pika.BasicProperties(delivery_mode=2)) or time.sleep(1) for i in range(1,6)]; connection.close()\""
    environment:
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.5"
          pids: 128

  consumer:
    image: python:3.12-slim
    depends_on:
      - rabbitmq
    restart: on-failure
    hostname: consumer
    command: >
      sh -c "pip install pika && python -u -c \"import pika, time; params=pika.URLParameters('amqp://guest:guest@rabbitmq:5672/'); connection=pika.BlockingConnection(params); channel=connection.channel(); channel.queue_declare(queue='task_queue', durable=True); def callback(ch, method, properties, body): print(f'Received {body.decode()}'); time.sleep(1); ch.basic_ack(delivery_tag=method.delivery_tag); channel.basic_qos(prefetch_count=1); channel.basic_consume(queue='task_queue', on_message_callback=callback); channel.start_consuming()\""
    environment:
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.5"
          pids: 128
