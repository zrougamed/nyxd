# nyx WSL2 distro (see docs/windows.md). Kept minimal on purpose.

[automount]
# C:\ etc. stay reachable as /mnt/c so compose files and bind mounts work.
enabled = true

[interop]
# The Linux side cannot launch Windows programs.
enabled = false
appendWindowsPath = false

[network]
generateResolvConf = true
generateHosts = true

[user]
default = root

[boot]
systemd = false
