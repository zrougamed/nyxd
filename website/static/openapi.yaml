openapi: 3.0.3
info:
  title: nyxd control API
  description: |
    Minimal HTTP API for **nyxd**, served on a **Unix domain socket** (default `/run/nyxd/nyxd.sock`).
    There is no TCP listener by default.

    **Calling the API**

    ```bash
    curl -sS --unix-socket /run/nyxd/nyxd.sock http://localhost/v1/ping
    ```

    Replace `/run/nyxd/nyxd.sock` with your socket path or `NYXD_SOCKET` / `nyx -socket`.

    **Authentication:** none today (local trust). Socket permissions are typically `0660`.

    **Errors:** many routes use `text/plain` bodies from `http.Error`; JSON endpoints return `application/json` on success.
  version: "1.0.0"
  license:
    name: PolyForm Noncommercial License 1.0.0
    url: https://polyformproject.org/licenses/noncommercial/1.0.0/

servers:
  - url: http://localhost
    description: |
      Use `curl --unix-socket <path> http://localhost/...` (host name is ignored; only the socket path matters).

tags:
  - name: system
    description: Health and version
  - name: images
    description: Image pull, list, and remove
  - name: containers
    description: Container lifecycle and exec

paths:
  /v1/ping:
    get:
      tags: [system]
      summary: Liveness probe
      operationId: ping
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PingResponse"

  /v1/version:
    get:
      tags: [system]
      summary: Daemon version metadata
      operationId: getVersion
      responses:
        "200":
          description: Version payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"

  /v1/info:
    get:
      tags: [system]
      summary: How the daemon runs and on what host
      description: |
        Plain facts for `nyx info` and bug reports: version and build, mode (`rootful`, `rootless`,
        `userns-remap`), network driver, storage and log directories with free space, kernel, cgroup v2
        and whether resource limits apply, AppArmor, the crun binary and version, and container and
        image counts. Fields that could not be read are empty.
      operationId: getInfo
      responses:
        "200":
          description: Daemon and host facts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfoResponse"
  /v1/metrics:
    get:
      tags: [system]
      summary: Prometheus metrics
      description: |
        Prometheus text format (0.0.4): per-container CPU, memory, network, block I/O, PIDs,
        restarts, health and OOM kills, labelled `name`, `image`, `compose_project`,
        `compose_service`; daemon uptime, containers by state, image count, build info and Go
        runtime basics. nyxd `-metrics-listen ADDR` also serves it at `http://ADDR/metrics`.
      operationId: getMetrics
      responses:
        "200":
          description: Metrics
          content:
            text/plain:
              schema:
                type: string

  /v1/system/df:
    get:
      tags: [system]
      summary: Disk use (nyx system df)
      description: |
        Count, in use, size and reclaimable bytes for images (shared layers counted once, extracted
        layers included), build cache, containers (writable layers), logs and volumes, plus per-item
        details. Sizes are allocated bytes on disk.
      operationId: systemDF
      responses:
        "200":
          description: Disk use
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: array
                    items:
                      type: object
                      properties:
                        type: {type: string, enum: [images, build_cache, containers, logs, volumes]}
                        count: {type: integer}
                        active: {type: integer}
                        size: {type: integer}
                        reclaimable: {type: integer}
                  items:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: object
                        properties:
                          name: {type: string}
                          size: {type: integer}
                          unique: {type: integer}
                          active: {type: boolean}
                          detail: {type: string}

  /v1/system/prune:
    post:
      tags: [system]
      summary: Remove what nothing references (nyx system prune)
      description: |
        Exited containers and their logs, logs and overlays of containers that no longer exist, the
        build cache and layers no image uses (both kept for an hour after they were written).
        `images` also removes images no container uses, `volumes` named volumes no container mounts.
        Running containers and what they use are never touched.
      operationId: systemPrune
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                images: {type: boolean}
                volumes: {type: boolean}
                dry_run: {type: boolean}
      responses:
        "200":
          description: What was (or would be) removed, and the bytes reclaimed (an estimate with dry_run)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  dry_run: {type: boolean}
                  removed:
                    type: object
                    additionalProperties:
                      type: array
                      items: {type: string}
                  reclaimed: {type: integer}
  /v1/containers/{id}/archive:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      - name: path
        in: query
        required: true
        description: Absolute path in the container
        schema: {type: string}
    get:
      tags: [containers]
      summary: Copy a file or directory out of a running container (nyx cp)
      description: |
        A tar stream of `path`, its top-level entry named after the last element of `path`. Symlinks
        are stored, not followed; symlinks along `path` resolve inside the container's root. Paths
        under a bind mount read the mount's source.
      operationId: containerArchiveGet
      responses:
        "200":
          description: Tar stream
          content:
            application/x-tar:
              schema: {type: string, format: binary}
        "400": {description: "Relative path, kernel filesystem (/proc, /sys, /dev) or tmpfs mount"}
        "404": {description: No such container, or no such path in it}
        "409": {description: The container is not running}
    put:
      tags: [containers]
      summary: Copy a tar stream into a running container (nyx cp)
      description: |
        When `path` is an existing directory, the archive is extracted into it. Otherwise it is
        extracted into the parent with the archive's top-level entry renamed to the last element of
        `path`. Every write stays inside the container; names starting with `.wh.` are ordinary files.
        Ownership is taken from the archive.
      operationId: containerArchivePut
      parameters:
        - name: raw
          in: query
          description: "1: extract the stream as is; `path` must be an existing directory"
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/x-tar:
            schema: {type: string, format: binary}
      responses:
        "200": {description: Copied}
        "400": {description: Invalid path or archive}
        "404": {description: No such container, or no such parent directory}
        "409": {description: The container is not running}

  /v1/events:
    get:
      tags: [system]
      summary: Stream container and image events (nyx events)
      description: |
        Newline-delimited JSON, one event per line, kept open until the client goes away. `since`
        first replays the events nyxd keeps in memory (the last 1000). A client that falls behind
        receives `{"type":"events_dropped"}` and is disconnected. Container actions: create, start,
        die, oom, restart, health_status, remove; image actions: pull, build, remove.
      operationId: getEvents
      parameters:
        - name: since
          in: query
          description: A duration back from now (`10m`) or a time (RFC 3339 or Unix seconds)
          schema: {type: string}
        - name: filter
          in: query
          description: "`type=`, `event=`, `container=` or `image=`; repeat for alternatives of one key"
          schema:
            type: array
            items: {type: string}
          style: form
          explode: true
      responses:
        "200":
          description: Event stream
          content:
            application/x-ndjson:
              schema:
                type: object
                properties:
                  time: {type: string, format: date-time}
                  type: {type: string, enum: [container, image, events_dropped]}
                  action: {type: string}
                  id: {type: string}
                  image: {type: string}
                  attributes:
                    type: object
                    additionalProperties: {type: string}
        "400": {description: Invalid since or filter}

  /v1/network:
    get:
      tags: [system]
      summary: Active network identity
      description: |
        Returns the daemon's active network driver and, for the native driver,
        the default bridge name, gateway IPv4, and subnet CIDR. Values match
        the live address on the bridge when the interface exists (stock daemon:
        `nyxbr0`, `10.88.0.1`, `10.88.0.0/16`).
      operationId: getNetwork
      responses:
        "200":
          description: Network identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkResponse"

  /v1/containers:
    get:
      tags: [containers]
      summary: List supervised containers
      description: |
        Without `detail`, returns `{"containers":["id",...]}` (IDs only).

        With `?detail=1` or `?detail=true`, also returns `items`: an array of
        `{id, image, ip, status}` suitable for `nyx ps`.
      operationId: listContainers
      parameters:
        - name: detail
          in: query
          required: false
          schema:
            type: string
            enum: ["1", "true", ""]
          description: When `1` or `true`, include per-container metadata in `items`.
        - name: all
          in: query
          required: false
          schema:
            type: string
            enum: ["1", "true", ""]
          description: |
            With `detail`, also list exited containers that were not removed (status `exited`,
            with `exit_code`), like `docker ps -a`.
      responses:
        "200":
          description: Container list (with or without detail)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ContainersResponse"
                  - $ref: "#/components/schemas/ContainersDetailResponse"

  /v1/images/pull:
    post:
      tags: [images]
      summary: Pull an image from a registry
      description: |
        When `stream` is **false** or omitted, returns a single JSON object on success.

        When `stream` is **true**, the response is **`application/x-ndjson`**: one JSON object per line
        (`PullEvent`), flushed progressively, ending with a `phase: done` line (or `phase: error`).
      operationId: pullImage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PullRequest"
      responses:
        "200":
          description: Success — either one JSON document or NDJSON stream
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PullResponseJSON"
            application/x-ndjson:
              schema:
                type: string
                format: binary
                description: |
                  Each line is a `PullEvent` JSON object. Final line uses `phase: done` with summary fields.
        "400":
          description: Bad request (invalid body / missing ref)
        "502":
          description: Registry or transport error (non-stream mode)
        "503":
          description: Image store not configured

  /v1/containers/run:
    post:
      tags: [containers]
      summary: Create and start a container
      description: |
        Starts an OCI workload via crun. If the image is not in the local store, the daemon pulls it first.
        When `stream: true`, the response is `application/x-ndjson` (same `PullEvent` lines as `POST /v1/images/pull` if a pull runs, then `phase: run` with `container_id`). Otherwise the response is a single JSON `RunResponse`.
        With `Content-Type: application/x-nyxd-run+v1` (first line JSON `RunRequest`, then optional stdin), the response is the container's attached stdio until it exits (`nyx run -it`, and foreground `nyx run --rm`), and `X-Nyxd-Container-Id` is set. nyxd v1.1.5 and older attach only with `tty` or `stdin` and otherwise return a JSON `RunResponse`.
        If `id` is omitted, the server generates one from the image reference.
      operationId: runContainer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunRequest"
          application/x-nyxd-run+v1:
            schema:
              type: string
              format: binary
            description: JSON header line (RunRequest) then raw stdin until EOF (`nyx run -i` / `-it`).
      responses:
        "200":
          description: Started (JSON), pull+run stream (NDJSON when `stream` is true), or attached stdio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResponse"
            application/x-ndjson:
              schema:
                type: string
                format: binary
              description: |
                Same `PullEvent` lines as image pull when a registry fetch is required, including a final `phase: done` summary after pull, then a terminal `{"phase":"run","ok":true,"container_id":"...","ref":"..."}` line.
            application/octet-stream:
              schema:
                type: string
                format: binary
              description: Attached container stdio when using `application/x-nyxd-run+v1`
        "400":
          description: Validation or start error (plain text or NDJSON `phase:error` when streaming)
        "502":
          description: Registry or transport error during pull (plain text, or NDJSON when streaming)
        "503":
          description: Supervisor or image store unavailable

  /v1/compose/up:
    post:
      tags: [containers]
      summary: Apply a nyx compose file and start the stack
      description: |
        Parses a compose file (strict subset: `nyx-compose`, `docker-compose`, `compose`, or `podman-compose`
        YAML on disk), merges `.env` from the compose directory with the process environment, substitutes
        `${VAR}` in the raw YAML, pulls missing images, maps services to container specs (including compose
        healthchecks and volume bind mounts), then starts containers in `depends_on` order via ordered
        sequential start. Before a service starts, its `depends_on` conditions are met:
        `service_healthy` waits for the dependency's health check to pass (refused with 400 when the
        dependency has no `healthcheck`), `service_completed_successfully` waits for it to exit 0 (a
        non-zero exit fails the request and the remaining services are not started).
      operationId: composeUp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComposeProjectRequest"
      responses:
        "200":
          description: Stack started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComposeUpResponse"
        "400":
          description: Invalid body, compose validation, pull, or start error
        "503":
          description: Supervisor or image store unavailable

  /v1/compose/start:
    post:
      tags: [containers]
      summary: Start stopped compose services
      description: |
        Starts the stack's exited services (all, or `services`) in dependency order with the
        settings they were created with. Running services are left alone. A service that never
        had a container is an error: `compose up` creates it.
      operationId: composeStart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComposeProjectRequest"
      responses:
        "200":
          description: "`{\"ok\":true,\"started\":[ids]}`"
        "400":
          description: Invalid body, unknown service, or a start failed
        "404":
          description: A service has no container
        "503":
          description: Supervisor unavailable

  /v1/compose/restart:
    post:
      tags: [containers]
      summary: Restart compose services
      description: |
        Restarts the stack's services (all, or `services`) one by one in dependency order; exited
        ones are started.
      operationId: composeRestart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComposeProjectRequest"
      responses:
        "200":
          description: "`{\"ok\":true,\"restarted\":[ids]}`"
        "400":
          description: Invalid body, unknown service, or a start failed
        "404":
          description: A service has no container
        "503":
          description: Supervisor unavailable

  /v1/compose/stop:
    post:
      tags: [containers]
      summary: Stop all services from a compose file
      description: |
        Resolves the same project + container IDs as `compose/up`, then stops each service in reverse
        dependency order. Missing containers are ignored (idempotent).
      operationId: composeStop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComposeProjectRequest"
      responses:
        "200":
          description: Stop completed (per-service errors are not partial — all-or-nothing when a stop fails)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComposeStopResponse"
        "400":
          description: Invalid body or compose validation error
        "503":
          description: Supervisor unavailable

  /v1/compose/down:
    post:
      tags: [containers]
      summary: Remove compose stack containers (and optionally named volume dirs)
      description: |
        Stops and removes supervised containers for the stack (reverse dependency order). When
        `remove_volumes` is true, deletes host directories for **declared** top-level named volumes
        under `{nyxd base}/volumes/<project>/…` only if no running container still references that path.
      operationId: composeDown
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComposeProjectRequest"
      responses:
        "200":
          description: Stack torn down
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComposeDownResponse"
        "400":
          description: Invalid body or compose validation error
        "503":
          description: Supervisor unavailable

  /v1/containers/{id}/stop:
    post:
      tags: [containers]
      summary: Stop a container
      description: Sends the image stop signal (default SIGTERM) then SIGKILL if needed.
      operationId: stopContainer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stop accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StopResponse"
        "400":
          description: Bad request
        "404":
          description: Container not found
        "503":
          description: Supervisor unavailable

  /v1/containers/{id}/start:
    post:
      tags: [containers]
      summary: Start an exited container
      description: |
        Starts a container that exited (or was stopped) again with the settings it was created
        with, until it is removed. `--rm` containers leave nothing to start. If the image layers
        were pruned since, the current image for the same reference is used.
      operationId: startContainer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StopResponse"
        "400":
          description: Start failed (e.g. port in use, image missing)
        "404":
          description: No such container
        "409":
          description: Already running
        "503":
          description: Supervisor unavailable

  /v1/containers/{id}/restart:
    post:
      tags: [containers]
      summary: Restart a container
      description: |
        Stops a running container (as `stop`, SIGKILL after `t` seconds when given) and starts it
        again with the same settings. An exited container is just started.
      operationId: restartContainer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: t
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 3600
          description: Seconds to wait for the stop before SIGKILL (default the container's stop timeout)
      responses:
        "200":
          description: Restarted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StopResponse"
        "400":
          description: Bad `t`, or the start failed
        "404":
          description: No such container
        "503":
          description: Supervisor unavailable

  /v1/containers/{id}/remove:
    post:
      tags: [containers]
      summary: Remove a container
      description: |
        Stops the container if needed, deletes crun state, and tears down
        network and overlay resources. For an exited container, deletes its saved
        settings and its logs.
      operationId: removeContainer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoveResponse"
        "400":
          description: Bad request
        "404":
          description: Container not found
        "503":
          description: Supervisor unavailable

  /v1/containers/{id}/exec:
    post:
      tags: [containers]
      summary: Run a command inside a running container
      description: |
        Streams combined stdout/stderr as raw bytes (`application/octet-stream`).
        The HTTP connection stays open until the exec completes.

        Body variants:
        - `application/json` — `ExecRequest` only (stdin closed).
        - `application/x-nyxd-exec+v1` — first line is JSON `ExecRequest` (`argv`, optional `tty`, optional `rows`/`cols`);
          remaining bytes stream to `crun exec` stdin (`nyx exec -i`).
      operationId: execInContainer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecRequest"
          application/x-nyxd-exec+v1:
            schema:
              type: string
              format: binary
            description: JSON header line (ExecRequest) then raw stdin until EOF.
      responses:
        "200":
          description: Raw command output (stream)
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: Bad request
        "503":
          description: Runtime unavailable

  /v1/containers/{id}/kill:
    post:
      tags: [containers]
      summary: Send a signal to a container (default SIGKILL)
      description: |
        Optional JSON body `{"signal":"KILL"}` (or `SIGKILL`). Used by foreground `nyx run` on Ctrl+C.
      operationId: killContainer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                signal:
                  type: string
                  description: Signal name without or with `SIG` prefix (e.g. `KILL`, `SIGTERM`).
      responses:
        "200":
          description: Kill accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KillResponse"
        "400":
          description: Bad request
        "404":
          description: Container not found
        "503":
          description: Supervisor unavailable

  /v1/containers/{id}/logs:
    get:
      tags: [containers]
      summary: Container stdout/stderr log file
      description: |
        Reads `logs/{id}.log` under the daemon data directory. With `plain=1` (default), JSONL
        lines are decoded to plain text. With `follow=1`, new lines are streamed until the client disconnects.
      operationId: containerLogs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: tail
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 99999
          description: Number of trailing lines to send first (default 200).
        - name: follow
          in: query
          required: false
          schema:
            type: string
            enum: ["1", "true", ""]
        - name: plain
          in: query
          required: false
          schema:
            type: string
          description: When not `0`, decode JSONL log entries to text (default on).
      responses:
        "200":
          description: Plain text log stream (or snapshot when not following)
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: No log file for this container
        "500":
          description: Read error

  /v1/containers/{id}/inspect:
    get:
      tags: [containers]
      summary: Low-level container details
      description: |
        Returns supervised container metadata (image, status, pid, env, mounts-related fields,
        resources, network) for `nyx inspect`. Accepts the same id forms as other container routes
        (canonical id, unambiguous prefix, or 12-char hex short id).
      operationId: inspectContainer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Inspect payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContainerInspect"
        "400":
          description: Ambiguous container id
        "404":
          description: Container not found
        "503":
          description: Supervisor unavailable

  /v1/containers/stats:
    get:
      tags: [containers]
      summary: Container resource usage snapshot
      description: |
        Returns one sample of CPU, memory, network I/O, block I/O and PIDs for supervised
        containers (cgroup v2 when available, otherwise `/proc`). The handler waits
        `interval_ms` between two samples so `cpu_percent` is meaningful.
        Used by `nyx stats` and `nyx compose stats` (the CLI polls this endpoint).
      operationId: containerStats
      parameters:
        - name: ids
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated container ids (empty = all supervised).
        - name: interval_ms
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10000
          description: Sample gap in milliseconds (default 500, capped at 10000).
      responses:
        "200":
          description: Stats snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContainerStatsResponse"
        "404":
          description: One of the requested ids was not found
        "503":
          description: Supervisor unavailable

  /v1/images:
    get:
      tags: [images]
      summary: List locally stored image references
      operationId: listImages
      responses:
        "200":
          description: Image ref list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImagesListResponse"
        "503":
          description: Image store not configured

  /v1/images/inspect:
    get:
      tags: [images]
      summary: Check that an image is in the local store
      description: Used by `nyx compose up` to decide which `build:` services to build.
      operationId: inspectImage
      parameters:
        - name: ref
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The image is present
          content:
            application/json:
              schema:
                type: object
                properties:
                  ref:
                    type: string
                  id:
                    type: string
                    description: Config digest (`sha256:...`)
        "400":
          description: Missing ref
        "404":
          description: Not in the local store
        "503":
          description: Image store not configured

  /v1/images/remove:
    post:
      tags: [images]
      summary: Remove local image metadata for a ref
      operationId: removeImage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageRemoveRequest"
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageRemoveResponse"
        "400":
          description: Bad request
        "503":
          description: Image store not configured

  /v1/images/prune:
    post:
      tags: [images]
      summary: Remove local image metadata not referenced by any supervised container
      description: |
        Uses in-memory supervisor container specs (`ContainerSpec.Image` strings) as the keep set.
        Does not delete content blobs under `blobs/sha256`.
      operationId: pruneImages
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImagePruneRequest"
      responses:
        "200":
          description: Prune result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImagePruneResponse"
        "400":
          description: Bad request
        "503":
          description: Image store or supervisor not configured

  /v1/images/tag:
    post:
      tags: [images]
      summary: Give a local image another reference
      operationId: tagImage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageTagRequest"
      responses:
        "200":
          description: Tagged
        "400":
          description: Missing source or target
        "404":
          description: Source image not found

  /v1/images/push:
    post:
      tags: [images]
      summary: Push a local image to its registry
      description: |
        Streams `application/x-ndjson` progress using the pull event shape: `begin`, one `blob` per blob
        (`cached: true` when the registry already has it), `blob_done`, `manifest`, then `done` (with `digest`)
        or `error`. Authentication follows the registry challenge (Bearer or Basic); loopback registries
        (localhost, 127.0.0.1, ::1) use plain HTTP. See docs/images.md.
      operationId: pushImage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImagePushRequest"
      responses:
        "200":
          description: NDJSON push progress stream
          content:
            application/x-ndjson:
              schema:
                $ref: "#/components/schemas/PullEvent"
        "400":
          description: Bad request
        "404":
          description: Image not found locally

  /v1/images/save:
    get:
      tags: [images]
      summary: Export images as an archive
      description: |
        One tar with an OCI image layout plus a docker-archive manifest.json (loads with nyx, docker and podman).
      operationId: saveImages
      parameters:
        - name: ref
          in: query
          required: true
          description: Image reference (repeatable)
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
      responses:
        "200":
          description: Image archive
          content:
            application/x-tar:
              schema:
                type: string
                format: binary
        "400":
          description: No ref given
        "404":
          description: An image was not found

  /v1/images/load:
    post:
      tags: [images]
      summary: Import images from an archive
      description: |
        Accepts archives from nyx save, docker save (any version) and podman save, optionally gzip-compressed.
        Every blob is verified against its digest.
      operationId: loadImages
      requestBody:
        required: true
        content:
          application/x-tar:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Loaded references
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageLoadResponse"
        "400":
          description: Not an image archive, or a digest mismatch

  /v1/build:
    post:
      tags: [images]
      summary: Build an image from a Dockerfile
      description: |
        The request body is the build context as a tar archive (optionally gzip-compressed).
        `nyx build` creates it from a directory, honouring `.dockerignore`.

        The response streams `application/x-ndjson`: `{"stream": "..."}` lines with step
        headers and RUN output, then either `{"done": true, "image_id": "sha256:...", "tags": [...]}`
        or `{"error": "..."}`. A client disconnect cancels the build.

        RUN steps execute in the container sandbox (same seccomp, capabilities, and user
        namespace when rootless) with the host network. See docs/build.md.
      operationId: buildImage
      parameters:
        - name: t
          in: query
          description: Image reference to tag the result with (repeatable). Default `nyx-build:<id>`.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: dockerfile
          in: query
          description: Dockerfile path inside the context.
          schema:
            type: string
            default: Dockerfile
        - name: target
          in: query
          description: Build up to this stage (`FROM ... AS <name>`).
          schema:
            type: string
        - name: nocache
          in: query
          description: "`1` or `true` disables the build cache."
          schema:
            type: string
        - name: X-Registry-Config
          in: header
          description: |
            Credentials for pulling `FROM` images: base64url-encoded JSON mapping registry host
            (`docker.io`, `ghcr.io`, `localhost:5000`) to `{"username": ..., "password": ...}`.
            Used for this build only. `nyx build` fills it from your docker, podman or nyx login.
          schema:
            type: string
        - name: buildarg
          in: query
          description: Build argument as `KEY=VALUE` (repeatable).
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
      requestBody:
        required: true
        content:
          application/x-tar:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: NDJSON build progress stream
          content:
            application/x-ndjson:
              schema:
                $ref: "#/components/schemas/BuildEvent"
        "400":
          description: Invalid build context or parameters
        "503":
          description: Builder not configured

components:
  schemas:
    ImageTagRequest:
      type: object
      required: [source, target]
      properties:
        source:
          type: string
          example: myapp:1.0
        target:
          type: string
          example: registry.example.com/team/myapp:1.0

    ImagePushRequest:
      type: object
      required: [ref]
      properties:
        ref:
          type: string
          example: registry.example.com/team/myapp:1.0
        username:
          type: string
        password:
          type: string
          format: password

    ImageLoadResponse:
      type: object
      properties:
        ok:
          type: boolean
        refs:
          type: array
          items:
            type: string

    BuildEvent:
      type: object
      description: One line of the build stream; exactly one of stream, error, done is set.
      properties:
        stream:
          type: string
          description: Progress text or RUN output
        error:
          type: string
        done:
          type: boolean
        image_id:
          type: string
          example: sha256:4a8b8ff444f55f11c8d452a176c932fc49e74cb1e1030932dcd9b6bfcad9d2ec
        tags:
          type: array
          items:
            type: string

    PingResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          example: true

    InfoResponse:
      type: object
      properties:
        server_version: {type: string}
        commit: {type: string}
        build_date: {type: string}
        go_version: {type: string}
        mode:
          type: string
          enum: [rootful, rootless, userns-remap]
        host_uid:
          type: integer
          description: Host user running a rootless daemon (rootless only)
        subordinate_ids:
          type: boolean
          description: A subordinate ID range is mapped (false in single-ID rootless mode)
        network_driver: {type: string}
        dns: {type: string}
        socket: {type: string}
        base_dir: {type: string}
        log_dir: {type: string}
        storage_driver: {type: string}
        overlay_userxattr: {type: boolean}
        free_bytes:
          type: integer
          description: Space available on the base directory's filesystem
        os: {type: string}
        arch: {type: string}
        kernel: {type: string}
        cgroup_v2: {type: boolean}
        resource_limits:
          type: boolean
          description: Container CPU and memory limits are applied (false in rootless mode)
        apparmor: {type: boolean}
        crun_path: {type: string}
        crun_version: {type: string}
        containers_running: {type: integer}
        containers_stopped: {type: integer}
        images: {type: integer}

    VersionResponse:
      type: object
      required: [daemon, version, commit, buildDate]
      properties:
        daemon:
          type: string
          example: nyxd
        version:
          type: string
        commit:
          type: string
        buildDate:
          type: string

    NetworkResponse:
      type: object
      required: [driver]
      properties:
        driver:
          type: string
          description: Active `-net-driver` value (`native`, `cni`, or `host`).
          example: native
        bridge:
          type: string
          description: Default host bridge (native driver).
          example: nyxbr0
        gateway:
          type: string
          description: Bridge gateway IPv4.
          example: "10.88.0.1"
        subnet:
          type: string
          description: Container subnet CIDR.
          example: "10.88.0.0/16"

    ContainersResponse:
      type: object
      required: [containers]
      properties:
        containers:
          type: array
          items:
            type: string

    ContainersDetailResponse:
      type: object
      required: [containers, items]
      properties:
        containers:
          type: array
          items:
            type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContainerItem"

    ContainerItem:
      type: object
      required: [id, short_id, image, status]
      properties:
        id:
          type: string
          description: Canonical supervisor id (e.g. compose project_service).
        short_id:
          type: string
          description: Stable 12-char lowercase hex id (Docker-style) derived from id; use for ps/stop prefixes.
        image:
          type: string
        ip:
          type: string
        ports:
          type: string
        status:
          type: string
          description: crun state status (e.g. running, stopped), or `exited` for a container that is not running
        exit_code:
          type: integer
          description: Exit status of an exited container (128+N for signal N)

    ContainerInspect:
      type: object
      required: [id, short_id, image, status, restarts, intentionally_stopped]
      properties:
        id:
          type: string
        short_id:
          type: string
        image:
          type: string
        status:
          type: string
        pid:
          type: integer
        ip:
          type: string
        ports_display:
          type: string
        env:
          type: array
          items:
            type: string
        args:
          type: array
          items:
            type: string
        workdir:
          type: string
        hostname:
          type: string
        restart_policy:
          type: string
        restarts:
          type: integer
        intentionally_stopped:
          type: boolean
        auto_remove:
          type: boolean
        host_network:
          type: boolean
        read_only:
          type: boolean
        privileged:
          type: boolean
        bundle_dir:
          type: string
        rootfs:
          type: string
        netns:
          type: string
        created_at:
          type: string
          description: RFC3339 from supervisor persist file mtime when present.
        exit_code:
          type: integer
          nullable: true

    ContainerStatsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContainerStats"

    ContainerStats:
      type: object
      required: [id, short_id, name, status, cpu_percent, mem_usage, mem_limit, mem_percent, net_rx, net_tx, block_read, block_write, pids, read_at]
      properties:
        id:
          type: string
        short_id:
          type: string
        name:
          type: string
          description: Canonical id (docker NAME column).
        status:
          type: string
        cpu_percent:
          type: number
          description: Percent of one CPU between the two samples.
        mem_usage:
          type: integer
          format: int64
        mem_limit:
          type: integer
          format: int64
        mem_percent:
          type: number
        net_rx:
          type: integer
          format: int64
        net_tx:
          type: integer
          format: int64
        block_read:
          type: integer
          format: int64
        block_write:
          type: integer
          format: int64
        pids:
          type: integer
          format: int64
        source:
          type: string
          description: "`cgroup` or `proc` fallback."
        read_at:
          type: string
        error:
          type: string
          description: Present when the container is not running or stats could not be read.

    RemoveResponse:
      type: object
      required: [ok, id]
      properties:
        ok:
          type: boolean
        id:
          type: string

    KillResponse:
      type: object
      required: [ok, id, signal]
      properties:
        ok:
          type: boolean
        id:
          type: string
        signal:
          type: string
          example: KILL

    ImagesListResponse:
      type: object
      required: [images]
      properties:
        images:
          type: array
          items:
            type: string

    ImageRemoveRequest:
      type: object
      required: [ref]
      properties:
        ref:
          type: string

    ImageRemoveResponse:
      type: object
      required: [ok, ref]
      properties:
        ok:
          type: boolean
        ref:
          type: string

    ImagePruneRequest:
      type: object
      properties:
        dry_run:
          type: boolean
          description: If true, only list refs that would be removed.

    ImagePruneResponse:
      type: object
      required: [ok, dry_run, removed, in_use]
      properties:
        ok:
          type: boolean
        dry_run:
          type: boolean
        removed:
          type: array
          items:
            type: string
        in_use:
          type: integer
          description: Count of distinct image refs held by supervised containers.

    PullRequest:
      type: object
      required: [ref]
      properties:
        ref:
          type: string
          description: Image reference (e.g. `nginx:alpine` or `registry/repo@sha256:...`)
          example: nginx:alpine
        stream:
          type: boolean
          description: If true, response is NDJSON stream instead of a single JSON object
        username:
          type: string
          description: Optional registry user for Basic auth / token flows during pull
        password:
          type: string
          description: Optional registry password

    PullResponseJSON:
      type: object
      required: [ok, ref, config]
      properties:
        ok:
          type: boolean
        ref:
          type: string
        config:
          type: object
          description: Subset of OCI image config
          properties:
            os:
              type: string
            architecture:
              type: string
            entrypoint:
              type: array
              items:
                type: string
            cmd:
              type: array
              items:
                type: string
            working_dir:
              type: string
            env_len:
              type: integer

    PullEvent:
      type: object
      description: One NDJSON line when `stream` is true
      required: [phase]
      properties:
        phase:
          type: string
          enum:
            - begin
            - auth
            - manifest
            - config
            - layer
            - progress
            - layer_done
            - meta
            - done
            - error
        ref:
          type: string
        message:
          type: string
        media_type:
          type: string
        layer_count:
          type: integer
        index:
          type: integer
        count:
          type: integer
        digest:
          type: string
        size:
          type: integer
          format: int64
        cached:
          type: boolean
        current:
          type: integer
          format: int64
        ok:
          type: boolean
        ref_out:
          type: string
        config:
          $ref: "#/components/schemas/PullSummary"
        error:
          type: string

    PullSummary:
      type: object
      properties:
        os:
          type: string
        architecture:
          type: string
        entrypoint:
          type: array
          items:
            type: string
        cmd:
          type: array
          items:
            type: string
        working_dir:
          type: string
        env_len:
          type: integer
        rootfs_diff_ids:
          type: integer

    RunRequest:
      type: object
      required: [image]
      properties:
        id:
          type: string
          description: Optional container id; generated if empty
        image:
          type: string
          description: Image ref as stored after pull (e.g. `nginx:alpine`)
        args:
          type: array
          items:
            type: string
        env:
          type: array
          items:
            type: string
        hostname:
          type: string
        restart:
          type: string
          description: Restart policy (`always`, `on-failure`, `unless-stopped`, `never`, …); default `never`, as in Docker
        publish:
          type: array
          description: Docker-style port specs (e.g. `8080:80`, `127.0.0.1:9000:443/udp`)
          items:
            type: string
        ports:
          type: array
          description: Structured port maps (alternative to `publish`)
          items:
            type: object
            required: [hostPort, containerPort]
            properties:
              hostPort:
                type: integer
              containerPort:
                type: integer
              protocol:
                type: string
                enum: [tcp, udp]
        stream:
          type: boolean
          description: |
            When true, use `application/x-ndjson` for the response if a pull is needed or for the terminal `run` line when no pull (same event schema as `POST /v1/images/pull` plus final `phase: run`).
            Ignored when the request uses `application/x-nyxd-run+v1` (attached stdin/TTY).
        tty:
          type: boolean
          description: Allocate a PTY for the container init (`nyx run -t` / docker `-t`)
        stdin:
          type: boolean
          description: |
            Keep init stdin open. With `Content-Type: application/x-nyxd-run+v1`, bytes after the
            JSON header line are streamed to stdin (`nyx run -i` / docker `-i`).
        auto_remove:
          type: boolean
          description: |
            Delete container logs when the workload exits and will not restart (`nyx run --rm`).
            Incompatible with restart `always` / `unless-stopped`.
        volumes:
          type: array
          items:
            type: string
          description: |
            Bind mounts, `SRC:DST[:ro|rw]` (`nyx run -v`). SRC is an absolute path on the nyxd
            host and must exist; DST is absolute.
        network:
          type: string
          description: |
            `host` shares the host's network namespace (`nyx run --network host`); cannot be
            combined with published ports. Unset, `bridge` or `default` use the daemon's driver.
        memory:
          type: string
          description: Memory limit, e.g. `256m`, `1g` (`nyx run --memory`)
        memory_swap:
          type: string
          description: Memory plus swap; equal to `memory` means no swap (`nyx run --memory-swap`)
        cpus:
          type: string
          description: CPU limit in cores, e.g. `0.5` (`nyx run --cpus`)
        pids_limit:
          type: integer
          minimum: 1
          description: Maximum number of processes in the container (`nyx run --pids-limit`)
        oom_score_adj:
          type: integer
          minimum: -1000
          maximum: 1000
          description: OOM killer preference for the container init (`nyx run --oom-score-adj`)
        read_only:
          type: boolean
          description: Mount the root filesystem read-only (`nyx run --read-only`)
        tmpfs:
          type: array
          items:
            type: string
          description: |
            tmpfs mounts, `PATH[:OPTIONS]` (`nyx run --tmpfs`). Defaults to `nosuid,nodev,noexec`;
            `suid`, `dev`, `exec`, `ro`, `size=`, `mode=`, `uid=`, `gid=` and `nr_inodes=` are accepted.
        rows:
          type: integer
          description: Initial PTY height when `tty` is true
        cols:
          type: integer
          description: Initial PTY width when `tty` is true
        healthcheck:
          $ref: "#/components/schemas/RunHealthcheck"
        registry_username:
          type: string
          description: Optional registry credentials when a pull is required before run
        registry_password:
          type: string

    RunHealthcheck:
      type: object
      description: |
        Optional readiness and ongoing checks. The daemon waits until the first successful probe (within a bounded budget) before returning from a non-streaming run, then continues checking in the background. Unhealthy transitions trigger a kill so restart policy can respawn the workload.
      required: [type]
      properties:
        type:
          type: string
          enum: [exec, http, tcp, none]
        command:
          type: array
          items:
            type: string
          description: Required for `exec` — argv inside the container (`crun exec`).
        url:
          type: string
          description: Required for `http` — GET target expecting 2xx.
        address:
          type: string
          description: Required for `tcp` — host:port to dial.
        interval:
          type: string
          description: Go duration string for background checks (e.g. `30s`).
        timeout:
          type: string
          description: Per-probe timeout (e.g. `10s`).
        retries:
          type: integer
          description: Consecutive failures before declaring unhealthy.
        start_period:
          type: string
          description: Grace period before failures count (Go duration).

    ComposeProjectRequest:
      type: object
      description: |
        Provide **either** `file` (path on the daemon host) **or** `yaml` plus `context_dir`.
        The optional `remove_volumes` flag is honored only by **`POST /v1/compose/down`**.
      properties:
        file:
          type: string
          description: Path to compose file readable by nyxd (e.g. `nyx-compose.yaml`, `docker-compose.yml`)
        yaml:
          type: string
          description: Full compose document as a string (requires `context_dir`)
        context_dir:
          type: string
          description: Directory used for `.env` loading and resolving relative bind mounts when `yaml` is set
        project:
          type: string
          description: |
            Prefix for named volume directories and container IDs. When omitted, defaults to the
            basename of the compose file's parent directory if `file` is set (Docker Compose style),
            or the basename of `context_dir` if `yaml` is set. Use the same value for `up`, `stop`,
            and `down`.
        recreate:
          type: string
          enum: ["", force, never]
          description: |
            Compose up only: running services whose image or configuration changed are recreated
            (default); `force` recreates all of them, `never` keeps them as they are.
        wait_timeout:
          type: string
          description: |
            Compose up only: how long to wait, in total, for `depends_on` conditions
            (`service_healthy`, `service_completed_successfully`) before failing (Go duration,
            e.g. `2m`). Default `5m`.
        remove_volumes:
          type: boolean
          description: When true (compose down only), delete on-disk named volume directories declared in the file after containers are removed
        services:
          type: array
          items:
            type: string
          description: compose start / restart only; limit to these services (default all)
        registry_auth:
          type: object
          description: |
            Compose up only: credentials for the images it pulls, by registry host (`docker.io`,
            `ghcr.io`, ...). A service's own `registry_username` / `registry_password` wins. Used for
            this request only, never stored. Images of services with `build:` are never pulled: build
            them first (`nyx compose up` does), or compose up fails with "not built yet".
          additionalProperties:
            type: object
            properties:
              username:
                type: string
              password:
                type: string

    ComposeUpResponse:
      type: object
      required: [ok, ids]
      properties:
        services:
          type: array
          description: What compose up did with each service, in start order
          items:
            type: object
            properties:
              id: {type: string}
              service: {type: string}
              action:
                type: string
                enum: [started, recreated, up to date, kept]
              reason:
                type: string
                description: "image changed, config changed, --force-recreate, or ...--no-recreate"
        ok:
          type: boolean
        ids:
          type: array
          items:
            type: string
          description: Container IDs started, in dependency order

    ComposeStopResponse:
      type: object
      required: [ok, stopped]
      properties:
        ok:
          type: boolean
        stopped:
          type: array
          items:
            type: string
          description: Container IDs stopped, in reverse dependency order

    ComposeDownResponse:
      type: object
      required: [ok, removed]
      properties:
        ok:
          type: boolean
        removed:
          type: array
          items:
            type: string
          description: Container IDs removed, in reverse dependency order
        removed_volume_paths:
          type: array
          items:
            type: string
          description: Host paths deleted when `remove_volumes` was true (omitted when empty)

    RunResponse:
      type: object
      required: [ok, id, image]
      properties:
        ok:
          type: boolean
        id:
          type: string
        image:
          type: string

    StopResponse:
      type: object
      required: [ok, id]
      properties:
        ok:
          type: boolean
        id:
          type: string

    ExecRequest:
      type: object
      required: [argv]
      properties:
        argv:
          type: array
          items:
            type: string
          description: argv[0] is the program to exec
        tty:
          type: boolean
          description: If true, allocate a pseudo-terminal (crun exec --tty) for shells and line editing.
        rows:
          type: integer
          minimum: 1
          description: Initial PTY height (optional). Sent by nyx for `-t` when stdin is a TTY.
        cols:
          type: integer
          minimum: 1
          description: Initial PTY width (optional). Sent by nyx for `-t` when stdin is a TTY.
